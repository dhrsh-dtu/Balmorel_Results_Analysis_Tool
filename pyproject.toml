[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balmorel-results-analysis-tool"
version = "0.1.0"
description = "Streamlit dashboard + export CLI for Balmorel MainResults GDX files."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "dhrsh-dtu" }]
keywords = ["balmorel", "energy", "gams", "dashboard", "visualisation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=2.0",
]

[project.optional-dependencies]
export = ["pybalmorel>=1.0.0", "gamsapi[transfer]>=47.0"]
app = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
balmorel-export = "balmorel_dashboard.__main__:main"

[tool.setuptools]
packages = ["balmorel_dashboard", "lib"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
